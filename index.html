<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hockey Manager Junior</title>
<meta name="theme-color" content="#1D5FAA">
<meta name="description" content="Jeu de manager de hockey sur gazon U12">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hockey Junior">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4EDF6; --surface:#FFFFFF; --surface2:#F2F6FB; --ink:#0F2440; --muted:#5B6E86;
  --turf:#1D5FAA; --turf2:#18528F; --line:#F4F8FC; --ball:#FFC928; --hot:#F0456F; --good:#1E9E68; --warn:#E59A00;
  --club:#E0662B; --edge:#CFDbe8;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0D1A2B; --surface:#15263B; --surface2:#1B2F48; --ink:#E8F0FA; --muted:#98ACC4; --edge:#2A4262; --turf:#1B5496; --turf2:#16487F; }
}
:root[data-theme="dark"]{ --bg:#0D1A2B; --surface:#15263B; --surface2:#1B2F48; --ink:#E8F0FA; --muted:#98ACC4; --edge:#2A4262; --turf:#1B5496; --turf2:#16487F; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2",ui-rounded,"Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.1}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* barre du haut */
.top{background:var(--turf);color:#fff}
.top .wrap{display:flex;align-items:center;gap:16px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.crest{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;border:3px solid #fff;flex:none;font-size:17px;letter-spacing:.5px}
.crest.big{width:84px;height:84px;font-size:28px;border-width:4px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand b{font-size:22px;display:block;line-height:1}
.brand small{opacity:.8;font-size:14px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:transparent;border:0;color:#fff;padding:6px 14px;border-radius:999px;font-weight:600;font-size:16px}
nav button[aria-current="true"]{background:#fff;color:var(--turf)}
nav button:hover:not([aria-current="true"]){background:rgba(255,255,255,.15)}

main{padding:26px 0 60px}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border-radius:20px;padding:20px;border:2px solid var(--edge)}
.panel h2{font-size:24px;margin-bottom:12px}
.hint{color:var(--muted);font-size:15px;margin:4px 0 12px}
.btn{border:0;border-radius:14px;padding:10px 18px;font-weight:700;font-size:17px;background:var(--surface2);border:2px solid var(--edge)}
.btn.go{background:var(--ball);border-color:#E3AE00;color:#2B2100;box-shadow:0 4px 0 #D29F00}
.btn.go:active{transform:translateY(3px);box-shadow:0 1px 0 #D29F00}
.btn.blue{background:var(--turf);color:#fff;border-color:var(--turf2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--edge);background:var(--surface2);border-radius:12px;padding:6px 12px;font-weight:600;font-size:15px;text-align:left;line-height:1.15}
.seg button small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.seg button[aria-pressed="true"]{border-color:var(--turf);background:var(--turf);color:#fff}
.seg button[aria-pressed="true"] small{color:#D8E6F7}

/* terrain */
.pitch{position:relative;width:100%;aspect-ratio:600/500;max-height:70vh;border-radius:18px;overflow:hidden;user-select:none}
.pitch svg{position:absolute;inset:0;width:100%;height:100%}
.tok{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;padding:0;transition:left .45s ease,top .45s ease}
.tok .dot{width:clamp(26px,3.6vw,40px);height:clamp(26px,3.6vw,40px);border-radius:50%;background:var(--club);color:#fff;font-weight:800;display:grid;place-items:center;font-size:clamp(12px,1.4vw,16px);border:3px solid var(--ring,#fff);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.tok .nm{font-size:clamp(10px,1.1vw,13px);color:#fff;font-weight:700;background:rgba(8,30,60,.55);padding:0 6px;border-radius:6px;white-space:nowrap}
.tok.gk .dot{background:#243447}
.tok.sel .dot{outline:4px solid var(--ball);outline-offset:2px}
.tok.opp .dot{background:var(--opp,#555);width:clamp(20px,2.6vw,30px);height:clamp(20px,2.6vw,30px);font-size:clamp(10px,1.1vw,13px);border-width:2px}
.ball{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--ball);border:2px solid #fff;transform:translate(-50%,-50%);transition:left .4s ease,top .4s ease;box-shadow:0 0 0 4px rgba(255,201,40,.35)}

/* joueurs */
.plist{display:flex;flex-direction:column;gap:6px;max-height:640px;overflow:auto;padding-right:4px}
.pl{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:7px 10px;border-radius:12px;background:var(--surface2);border:2px solid transparent;text-align:left;width:100%}
.pl.sel{border-color:var(--ball)}
.pl.on{background:color-mix(in srgb,var(--turf) 12%,var(--surface2))}
.pos{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff}
.pos.G{background:#243447}.pos.D{background:#2F7DC1}.pos.M{background:#1E9E68}.pos.A{background:#E0662B}
.pl .n{font-weight:700;line-height:1.1}
.pl .n small{color:var(--muted);font-weight:500}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:3px}
.bar{font-size:11px;color:var(--muted);line-height:1}
.bar i{display:block;height:5px;border-radius:3px;background:var(--edge);margin-top:2px;overflow:hidden}
.bar i b{display:block;height:100%;background:var(--turf)}
.ovr{font-weight:800;font-size:22px;text-align:right;line-height:1}
.ovr small{display:block;font-size:12px;font-weight:600}
.en-hi{color:var(--good)}.en-mid{color:var(--warn)}.en-lo{color:var(--hot)}

/* accueil */
.hero{background:var(--turf);color:#fff;border-radius:24px;padding:26px;position:relative;overflow:hidden}
.hero .vs{display:flex;align-items:center;justify-content:center;gap:26px;margin:14px 0 20px}
.hero .side{text-align:center;width:180px}
.hero .side b{display:block;font-size:20px;margin-top:8px;line-height:1.1}
.hero .v{font-size:40px;font-weight:800;color:var(--ball)}
.hero .meta{text-align:center;opacity:.85}
.stars{color:var(--ball);letter-spacing:2px}
.tbl{width:100%;border-collapse:collapse;font-size:16px}
.tbl th{font-weight:600;color:var(--muted);text-align:right;padding:4px 6px;font-size:14px}
.tbl td{padding:6px;text-align:right;border-top:1px solid var(--edge)}
.tbl td:nth-child(2),.tbl th:nth-child(2){text-align:left}
.tbl tr.me td{background:color-mix(in srgb,var(--ball) 28%,transparent);font-weight:700}
.chip{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.warnbox{background:color-mix(in srgb,var(--hot) 14%,var(--surface));border-radius:14px;padding:10px 14px;margin-top:14px}

/* entraînement */
.train{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.train button{border:2px solid var(--edge);background:var(--surface2);border-radius:18px;padding:16px;text-align:left}
.train button:hover{border-color:var(--turf)}
.train .em{font-size:34px;display:block}
.train b{font-size:19px;display:block}
.train span{color:var(--muted);font-size:15px}

/* match */
.board{display:flex;align-items:center;justify-content:center;gap:18px;background:var(--ink);color:#fff;border-radius:18px;padding:10px 18px;margin-bottom:12px;flex-wrap:wrap}
.board .tm{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.board .sc{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;min-width:110px;text-align:center}
.board .clk{background:var(--ball);color:#2B2100;border-radius:10px;padding:0 10px;font-weight:800}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:560px;overflow:auto}
.feed li{background:var(--surface2);border-radius:12px;padding:7px 12px;font-size:16px}
.feed li .m{font-weight:800;color:var(--muted);margin-right:6px;font-variant-numeric:tabular-nums}
.feed li.goal{background:var(--ball);color:#2B2100}
.feed li.goal .m{color:#6B5200}
.feed li.bad{background:color-mix(in srgb,var(--hot) 22%,var(--surface2))}
.feed li.card{border-left:5px solid var(--good)}
.feed li.info{background:transparent;border:2px dashed var(--edge)}

/* fenêtre */
.modal{position:fixed;inset:0;background:rgba(6,18,36,.6);display:grid;place-items:center;padding:20px;z-index:25;overflow:auto}
.modal[hidden]{display:none}
.box{background:var(--surface);border-radius:24px;padding:24px;width:min(1100px,100%);max-height:calc(100% - 20px);overflow:auto}
.box.small{width:min(520px,100%);text-align:center}
.bigscore{font-size:64px;font-weight:800;line-height:1;margin:10px 0}
.setup{max-width:560px;margin:40px auto}
.setup input{width:100%;font:inherit;font-size:22px;padding:10px 14px;border-radius:14px;border:2px solid var(--edge);background:var(--surface2);color:var(--ink)}
.sw{display:flex;gap:10px;margin:8px 0 20px}
.sw button{width:44px;height:44px;border-radius:50%;border:4px solid transparent}
.sw button[aria-pressed="true"]{border-color:var(--ink)}
.pcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pcgrid label{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.pcgrid select{font:inherit;font-size:15px;padding:5px 8px;border-radius:10px;border:2px solid var(--edge);background:var(--surface2);color:var(--ink)}
.sq{width:30px;height:30px;border-radius:9px;border:2px solid var(--edge);background:var(--surface);display:grid;place-items:center;font-weight:800;flex:none;padding:0}
.sq[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.plw{display:flex;gap:6px;align-items:center}
.plw .pl{flex:1;min-width:0;width:auto}
.pl .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.pl.out{opacity:.55}
.msg{background:var(--ball);color:#2B2100;border-radius:12px;padding:8px 12px;margin-bottom:10px;font-weight:600}
.rules{margin:0;padding-left:20px;color:var(--muted);font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pcard{border:2px solid var(--edge);background:var(--surface);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px}
.pcard:hover{border-color:var(--turf)}
.pcard .hd{display:flex;align-items:center;gap:10px}
.num{width:44px;height:44px;border-radius:50%;background:var(--club);color:#fff;font-weight:800;display:grid;place-items:center;font-size:19px;flex:none}
.num.big{width:74px;height:74px;font-size:32px}
.pcard .hd b{font-size:19px;line-height:1.1;display:block}
.pcard .hd small{color:var(--muted)}
.pcard .ft{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
.sbig{display:grid;grid-template-columns:100px 1fr 44px;gap:10px;align-items:center;margin:6px 0}
.sbig i{height:12px;border-radius:6px;background:var(--edge);overflow:hidden;display:block}
.sbig i b{display:block;height:100%;background:var(--turf)}
.sbig .v{font-weight:800;text-align:right}
.sbig .v small{display:block;color:var(--good);font-size:12px;line-height:1}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.kpis div{background:var(--surface2);border-radius:14px;padding:8px;text-align:center}
.kpis b{font-size:26px;display:block;line-height:1.1}
.kpis span{font-size:13px;color:var(--muted)}
.box.mid{width:min(640px,100%)}
.mstats{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:-4px 0 12px;font-size:15px;color:var(--muted)}
.mstats b{color:var(--ink)}
.mstats .pen{color:var(--hot);font-weight:700}
.feed li.foul{border-left:5px solid var(--warn)}
#mpitch .tok,#mpitch .ball{transition:none}
.cam{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
.tok.star .dot{width:clamp(34px,4.6vw,48px);height:clamp(34px,4.6vw,48px);border-color:var(--ball);box-shadow:0 0 0 5px rgba(255,201,40,.45)}
.tok.star .nm{background:var(--ball);color:#2B2100}
.herohud{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--ball) 30%,var(--surface));border-radius:14px;padding:8px 14px;margin-bottom:10px;font-weight:600}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none}
.sheetin{pointer-events:auto;background:var(--surface);width:min(640px,100%);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.3);border:2px solid var(--ball);border-bottom:0}
.sheet .who{font-size:20px}
.sheet .sit{font-size:19px;font-weight:700;margin:4px 0 10px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.choices .btn{min-height:70px;font-size:19px;line-height:1.1}
.choices .btn small{display:block;font-size:13px;color:var(--muted);font-weight:500}
.tbar{position:relative;height:54px;border-radius:14px;background:var(--surface2);border:2px solid var(--edge);overflow:hidden;margin-bottom:12px}
.tzone{position:absolute;top:0;bottom:0;background:var(--good)}
.tcur{position:absolute;top:-2px;bottom:-2px;width:8px;margin-left:-4px;background:var(--ball);border:2px solid var(--ink);border-radius:4px}
.bigbtn{width:100%;min-height:64px;font-size:22px}
.res{font-size:34px;font-weight:800;text-align:center;margin:10px 0;color:var(--hot)}
.res.ok{color:var(--good)}
.feed li.hero{border-left:5px solid var(--ball);font-weight:600}
.herocard{margin-bottom:22px;border-color:var(--ball)}
button,canvas{touch-action:manipulation}
.pcbox canvas{width:100%;border-radius:16px;display:block;touch-action:manipulation}
#pcCtl{margin-top:12px;min-height:120px}
.pcch{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pcch .btn{text-align:left;min-height:70px;font-size:18px;line-height:1.15}
.pcch .btn small{display:block;font-size:13px;color:var(--muted);font-weight:500}
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.zones .btn{min-height:64px;font-size:20px}
#pcCtl .sit{font-size:18px;font-weight:700;margin:0 0 10px}
.feed li.pc{border-left:5px solid var(--hot);font-weight:700}
@media (max-width:640px){
  body{font-size:16px}.wrap{padding:0 12px}main{padding:14px 0 90px}.panel{padding:14px;border-radius:16px}
  .board{gap:8px;padding:8px 10px}.board .sc{font-size:30px;min-width:80px}.board .tm{font-size:15px}.board .crest{width:34px;height:34px;font-size:13px}
  .hero .side{width:120px}.hero .v{font-size:28px}.crest.big{width:64px;height:64px;font-size:22px}
  .modal{padding:0;place-items:stretch}.box,.box.mid,.box.small{border-radius:0;width:100%;max-height:none;min-height:100%;padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px))}
  .mstats{gap:10px;font-size:13px}.kpis b{font-size:21px}
  #mgb .btn{min-height:60px;min-width:90px;font-size:20px}
}
.tok{--fw:clamp(27px,4.3vw,46px);transform:translate(-50%,calc(var(--fw) * -1.18))}
.tok.opp{--fw:clamp(23px,3.7vw,40px)}
.tok .fig{display:block;position:relative;width:var(--fw);height:calc(var(--fw) * 1.3)}
.tok .fig svg{position:relative;width:100%;height:100%;display:block;transform-origin:50% 100%}
.tok .ring{position:absolute;left:-12%;right:-12%;bottom:-5%;height:24%;border:3px solid var(--ring,rgba(255,255,255,.85));border-radius:50%}
.tok.opp .ring{border-color:rgba(255,255,255,.35);border-width:2px}
.tok.sel .ring{border-color:var(--ball);box-shadow:0 0 10px var(--ball)}
.tok.star .ring{border-color:var(--ball);border-width:4px;box-shadow:0 0 12px var(--ball)}
.tok.star .fig{width:calc(var(--fw) * 1.15);height:calc(var(--fw) * 1.5)}
#mpitch.run .tok .fig svg{animation:bob .34s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
@keyframes bob{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-7%) rotate(2deg)}}
.tok .nm{margin-top:1px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 10px}
.steps span{background:var(--surface2);border:2px solid var(--edge);border-radius:999px;padding:2px 12px;font-weight:700;font-size:14px;color:var(--muted)}
.steps span.on{background:var(--ball);border-color:#E3AE00;color:#2B2100}
.steps span.done{background:var(--good);border-color:var(--good);color:#fff}
.minb{background:var(--ball);border-radius:10px;padding:0 10px;font-weight:800;color:#2B2100}
#pcCtl .how{font-size:17px;margin:0 0 10px}
#pcCtl .how b.g{color:var(--good)} #pcCtl .how b.r{color:var(--hot)}
.pcch .em{font-size:28px;display:block}
@media (prefers-reduced-motion:reduce){.tok,.ball{transition:none}#mpitch.run .tok .fig svg{animation:none}}
body.inmatch .top{display:none}
body.inmatch main{padding:0}
.mview{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - var(--sheetH,0px));display:flex;gap:16px;padding:10px 0}
.mmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;min-height:0}
.mmain>*{flex:none}
.mview .board{margin:0;padding:6px 14px;gap:10px;flex-wrap:nowrap}
.mview .board .sc{font-size:30px;min-width:80px}
.mview .board .crest{width:34px;height:34px;font-size:13px;border-width:2px}
.mview .mstats{margin:0;font-size:13px;gap:10px}
.mview .herohud{margin:0;padding:4px 12px;font-size:14px}
.cwrap{flex:1 1 0 !important;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
.cwrap .pitch{flex:none;width:min(100cqw,calc(100cqh * 1.2));max-height:none;aspect-ratio:600/500}
@media (orientation: portrait){
 .cwrap .pitch.rot{width:min(100cqh,calc(100cqw * 1.2));transform:rotate(-90deg)}
 .cwrap .pitch.rot .tok{transform:translate(-50%,-50%) rotate(90deg)}
}
.cwrap.c2 canvas{height:auto;border-radius:16px;display:block;touch-action:manipulation}
.cwrap.c3 canvas{width:min(100cqw,calc(100cqh * 560 / 320));height:auto}
.ticker{height:96px;overflow:hidden;gap:4px}
.ticker li{padding:4px 10px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mctl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mctl .btn{padding:8px 4px;font-size:14px;min-height:44px}
.mside{width:340px;flex:none;display:flex;flex-direction:column;min-height:0}
.mside .feed{max-height:none;flex:1;min-height:0}
@media (max-width:899px){.mside{display:none}}
@media (min-width:900px){.ticker{display:none}}
.box.fit{display:flex;flex-direction:column;height:calc(100dvh - 40px);overflow:hidden}
.box.fit #editor{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.box.fit #editor>*{flex:none}
.bench{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}

function rating(p,role){
  if(role==='G') return p.def;
  if(role==='A') return p.att*.5+p.tech*.25+p.vit*.25;
  if(role==='M') return p.tech*.4+p.vit*.3+p.att*.15+p.def*.15;
  return p.def*.6+p.vit*.2+p.tech*.2;
}
const ovr=p=>Math.round(rating(p,p.pos));
function eff(pos,role){
  if(pos===role) return 1;
  if(role==='G') return .35; if(pos==='G') return .5;
  const o={D:0,M:1,A:2}; return Math.abs(o[pos]-o[role])===1?.85:.7;
}
const efact=p=>(.7+.3*p.energy/100)*(.92+.16*(p.moral==null?70:p.moral)/100);

  const u8=cat==='U8',u10=cat==='U10'||u8, posList=u8?['G','D','D','D','M','M','M','A','A','A']:u10?['G','D','D','D','M','M','M','M','A','A','A']:['G','G','D','D','D','D','D','M','M','M','M','M','A','A','A','A'];
  const real=club==='Grez HC';
  let names=shuffle(real&&!u8?(u10?U10:GREZ):NAMES);if(u8&&HERO8){names=names.filter(n=>n!==HERO8);names.splice(7,0,HERO8)}

  return posList.map((pos,i)=>{
    const b=u8?rint(36,48):u10?rint(42,56):rint(46,60), bias={G:{def:12},D:{def:10,vit:2},M:{tech:8,vit:4},A:{att:10,vit:5}}[pos];
    const st=k=>clamp(b+rint(-6,6)+(bias[k]||0),30,85);
    return {id:'p'+i,name:real||u8?names[i]:names[i]+' '+pick(L.split(''))+'.',num:pos==='G'?(i===0?1:21):nums[i],pos,
      att:st('att'),def:st('def'),vit:st('vit'),tech:st('tech'),energy:100,goals:0,mins:0,apps:0,motm:0,hist:[]};
  }).map(p=>(p.base={att:p.att,def:p.def,vit:p.vit,tech:p.tech},p));

function makeFixtures(n){
  let arr=[...Array(n).keys()]; const rounds=[];
  for(let r=0;r<n-1;r++){
    const m=[];
    for(let i=0;i<n/2;i++){let h=arr[i],a=arr[n-1-i]; if((r+i)%2) [h,a]=[a,h]; m.push({h,a,hs:null,as:null});}
    rounds.push(m); arr=[arr[0],arr[n-1],...arr.slice(1,n-1)];
  }
  return rounds.concat(rounds.map(m=>m.map(x=>({h:x.a,a:x.h,hs:null,as:null}))));
}

/* feuille de match : 12 joueurs max, priorité à ceux qui ont le moins joué */
function autoSquad(){
  const rot=(a,b)=>(a.mins-moralOf(a)*.3)-(b.mins-moralOf(b)*.3)||ovr(b)-ovr(a);
  if(catOf()==='U8'){const ok=S.players.filter(p=>!(p.inj>0));return (ok.length>=3?ok:S.players).slice().sort(rot).slice(0,SQUAD_MAX).map(p=>p.id)}
  const ok=S.players.filter(p=>!(p.inj>0)),gks=(ok.some(p=>p.pos==='G')?ok:S.players).filter(p=>p.pos==='G').sort(rot), field=ok.filter(p=>p.pos!=='G').sort(rot);
  return [gks[0].id,...field.slice(0,SQUAD_MAX-1).map(p=>p.id)];
}
function autoLineup(ids){
  const free=new Set(ids);
  const order=slots().map((s,i)=>i).sort((a,b)=>'GDMA'.indexOf(slots()[a][0])-'GDMA'.indexOf(slots()[b][0]));
  const res=Array(slots().length).fill(null);
  for(const i of order){
    const role=slots()[i][0]; let best=null,bv=-1;
    for(const id of free){const p=byId(id), v=rating(p,role)*eff(p.pos,role)*efact(p); if(v>bv){bv=v;best=id}}
    res[i]=best; free.delete(best);
  }
  return res;
}
function autoPC(){
  const f=S.squad.map(byId).filter(p=>p.pos!=='G'), used=new Set();
  const best=fn=>{const p=f.filter(x=>!used.has(x.id)).sort((a,b)=>fn(b)-fn(a))[0];used.add(p.id);return p.id};
  const shoot=best(p=>p.att*.7+p.tech*.3), stop=best(p=>p.tech), push=best(p=>p.vit*.5+p.tech*.5);
  const def=[...f].sort((a,b)=>(b.def*.6+b.vit*.4)-(a.def*.6+a.vit*.4)).slice(0,nPCDef()).map(p=>p.id);
  return {push,stop,shoot,def};
}
function ensurePC(){
  const ok=id=>S.squad.includes(id), a=autoPC();
  ['push','stop','shoot'].forEach(k=>{if(!ok(S.pc[k]))S.pc[k]=a[k]});
  S.pc.def=S.pc.def.map((id,i)=>ok(id)?id:a.def.find(x=>!S.pc.def.includes(x))||a.def[i]);
}

/* ---------- forces ---------- */
function userPower(){
  let att=0,aw=0,def=0,dw=0,mid=0,mn=0,gk=35;
  slots().forEach(([role],i)=>{
    const p=byId(S.lineup[i]); if(!p) return;
    const r=rating(p,role)*eff(p.pos,role)*efact(p);
    if(role==='G'){gk=r;return}
    const wa={A:1,M:.5,D:.15}[role], wd={D:1,M:.5,A:.15}[role];
    att+=r*wa;aw+=wa;def+=r*wd;dw+=wd; if(role==='M'){mid+=r;mn++}
  });
  if(catOf()==='U8')gk=def/dw*.95;
  const f=FORMS[S.form].mod,s=STYLES[S.style].mod,pr=PRESS[S.press].mod;
  return {att:att/aw*f[0]*s[0]*pr[0], def:def/dw*f[1]*s[1]*pr[1], mid:(mn?mid/mn:40)*(S.press==='haut'?1.04:1), gk};
}
function lineupWarnings(){
  const w=[];
  const tired=S.lineup.map(byId).filter(p=>p&&p.energy<45);
  const sad=S.players.filter(p=>moralOf(p)<35);
  if(sad.length) w.push(`😞 Moral en berne : ${sad.map(first).join(', ')}. ${sad.length>1?'Donne-leur':'Donne-lui'} du temps de jeu !`);
  if(tired.length) w.push(`${tired.length===1?first(tired[0])+' est fatigué':tired.length+' joueurs de ta compo sont fatigués'} : pense à les laisser souffler.`);
  const wrong=slots().filter(([role],i)=>{const p=byId(S.lineup[i]);return p&&eff(p.pos,role)<.8}).length;
  if(wrong) w.push(`${wrong} joueur${wrong>1?'s jouent':' joue'} à un poste qui n’est pas le sien.`);
  return w;
}

function table(){
  const t=divIds(S.div).map(id=>({id,j:0,g:0,n:0,p:0,bp:0,bc:0,pts:0})), by={}; t.forEach(x=>by[x.id]=x);
  for(const r of S.fixtures) for(const f of r){ if(f.hs===null) continue;
    const H=by[f.h],A=by[f.a]; if(!H||!A) continue; H.j++;A.j++;H.bp+=f.hs;H.bc+=f.as;A.bp+=f.as;A.bc+=f.hs;
    if(f.hs>f.as){H.g++;A.p++;H.pts+=3} else if(f.hs<f.as){A.g++;H.p++;A.pts+=3} else {H.n++;A.n++;H.pts++;A.pts++} }
  return t.sort((a,b)=>b.pts-a.pts||(b.bp-b.bc)-(a.bp-a.bc)||b.bp-a.bp);
}

function teamTargets(M){
  const [bx,by]=M.ball, pos={}, pu=M.poss==='u', po=M.poss==='o';
  slots().forEach(([role,x,y],i)=>{
    if(role==='G'){pos['u'+i]=[clamp(x+(bx<25?2:0),3,9),clamp(50+(by-50)*.3,38,62)];return}
    const lim={D:pu?[14,56]:[14,42],M:pu?[26,76]:[14,60],A:pu?[42,93]:[30,78]}[role];
    pos['u'+i]=[clamp(x+(bx-45)*(pu?.5:.38)+(pu?7:-4),lim[0],lim[1]),clamp(y+(by-y)*(pu?.1:.32),6,94)];
  });
  oSlots().forEach(([role,x,y],i)=>{
    const ox=100-x;
    if(role==='G'){pos['o'+i]=[clamp(ox-(bx>75?2:0),91,97),clamp(50+(by-50)*.3,38,62)];return}
    const lim={D:po?[44,86]:[58,86],M:po?[24,74]:[40,86],A:po?[7,58]:[22,70]}[role];
    pos['o'+i]=[clamp(ox+(bx-55)*(po?.5:.38)-(po?7:-4),lim[0],lim[1]),clamp(y+(by-y)*(po?.1:.32),6,94)];
  });
  if(M.who){const i=S.lineup.indexOf(M.who);if(i>=0)pos['u'+i]=[bx-1.8,by]}
  if(M.oi!=null&&M.oi>=0)pos['o'+M.oi]=[bx+1.8,by];
  let press=null;
  const near=pref=>{let best=null,bd=1e9;Object.entries(pos).forEach(([k,[x,y]])=>{if(!k.startsWith(pref)||(k===pref+'0'&&!isU8()))return;const d=Math.hypot(x-bx,y-by);if(d<bd){bd=d;best=k}});return best};
  if(M.who||pu){press=near('o');if(press){const [x,y]=pos[press];pos[press]=[x+(bx+4-x)*.75,y+(by-y)*.75]}}
  else if(M.oi!=null||po){press=near('u');if(press){const [x,y]=pos[press];pos[press]=[x+(bx-4-x)*.75,y+(by-y)*.75]}}
  return {pos,press};
}

const AUTOSUB={off:['Non','Je fais tout moi-même'],fatigue:['Fatigue','On remplace les joueurs fatigués'],egal:['Temps de jeu égal','Tout le monde joue autant']};
function autoSubSeg(){return `<div class="seg">${Object.entries(AUTOSUB).map(([k,[n,d]])=>`<button data-act="autosub" data-v="${k}" aria-pressed="${S.autoSub===k}">${n}<small>${d}</small></button>`).join('')}</div>`}
const subTime=M=>S.autoSub!=='off'&&M.min>0&&M.min<MATCH_MIN&&M.min%5===0&&M.subDone!==M.min;
function doAutoSubs(M){
  const val=(p,role)=>rating(p,role)*eff(p.pos,role)*efact(p);
  const bench=()=>S.squad.filter(id=>!S.lineup.includes(id)).map(byId).filter(p=>p.pos!=='G'&&!(p.id===S.hero&&p.energy<80));
  const done=[];
  const swap=(i,b,why)=>{const p=byId(S.lineup[i]);S.lineup[i]=b.id;if(isU8()&&!M.fast)hi5(p,b);done.push(p.id,b.id);say(M.min,`🔄 Changement : ${first(b)} remplace ${first(p)} ${why}.`,'info');if(p.id===S.hero&&S.heroMode)say(M.min,`⭐ ${first(p)} souffle sur le banc pour récupérer.`,'info');if(b.id===S.hero&&S.heroMode)say(M.min,`⭐ ${first(b)} a récupéré : ${isU8()?'elle':'il'} revient sur le terrain !`,'info');if(b.sulk){b.sulk=0;b.moral=clamp(moralOf(b)+5,10,100)}};
  {const H=S.heroMode&&S.hero?byId(S.hero):null;if(H&&S.squad.includes(H.id)&&!S.lineup.includes(H.id)&&H.energy>=80){let bi=-1,be=101;S.lineup.forEach((id,i)=>{if(i===0&&!isU8())return;const q=byId(id);if(eff(H.pos,slots()[i][0])<(isU8()?0:.85))return;if(q.energy<be){be=q.energy;bi=i}});if(bi>=0&&be<85)swap(bi,H,`(⭐ ${first(H)} est en forme)`)}}
  const idx=[...Array(slots().length).keys()].slice(isU8()?0:1);
  if(S.autoSub==='fatigue'){
    idx.sort((a,b)=>byId(S.lineup[a]).energy-byId(S.lineup[b]).energy);
    for(const i of idx){
      if(done.length>=6) break;
      const role=slots()[i][0], p=byId(S.lineup[i]); if(p.energy>=78||done.includes(p.id)||(S.heroMode&&p.id===S.hero&&p.energy>=45&&!isU8())) continue;
      const b=bench().filter(x=>x.energy>=p.energy+15&&eff(x.pos,role)>=(isU8()?0:.85)&&!done.includes(x.id)).sort((x,y)=>val(y,role)-val(x,role))[0];
      if(b&&val(b,role)>val(p,role)) swap(i,b,`(${Math.round(p.energy)} % d’énergie)`);
    }
  } else {
    const pm=id=>M.played[id]||0;
    idx.sort((a,b)=>pm(S.lineup[b])-pm(S.lineup[a])||byId(S.lineup[a]).energy-byId(S.lineup[b]).energy);
    for(const i of idx){
      if(done.length>=4) break;
      const role=slots()[i][0], p=byId(S.lineup[i]); if(done.includes(p.id)||(S.heroMode&&p.id===S.hero&&p.energy>=45&&!isU8())) continue;
      const b=bench().filter(x=>eff(x.pos,role)>=(isU8()?0:.85)&&!done.includes(x.id)&&pm(p.id)-pm(x.id)>=(isU8()?5:8)).sort((x,y)=>pm(x.id)-pm(y.id)||val(y,role)-val(x,role))[0];
      if(b) swap(i,b,`pour partager le temps de jeu`);
    }
  }
  if(done.length) ensurePC();
  return done.length/2;
}

let GAME=null;
function openTraining(k){

  const cs=getComputedStyle(document.documentElement);

  newRound(); requestAnimationFrame(gameLoop);

function mgScale(G){const d=DIFF();if(G.aimSp)G.aimSp/=d;if(G.gkSp)G.gkSp/=d;if(G.asp)G.asp/=d;if(G.csp)G.csp/=d;if(G.k==='tech'){G.zw=Math.min(160,G.zw*d);G.zx=Math.min(G.zx,500-G.zw)}if(G.tsp)G.tsp/=d;if(G.k==='gk')G.T*=d;if(G.k==='jongle'&&G.round===0&&!G.scaled){G.g/=d;G.scaled=true}if(G.k==='slalom'&&G.round===0&&!G.scaled){G.v/=d;G.scaled=true}}
function newRound(){
  const G=GAME, r=G.round;
  if(MG2.includes(G.k)){newRound2(G);mgScale(G);G.phase='play';G.t=0;return}
  if(G.k==='att') Object.assign(G,{aim:80,aimDir:1,aimSp:260+r*45,gkSp:1.6+r*.3,shot:null});
  if(G.k==='def') Object.assign(G,{lane:G.lane??1,al:rint(0,2),ay:20,asp:140+r*28,feint:r>=1&&R()<.55,feinted:false});
  if(G.k==='vit') Object.assign(G,{light:'red',delay:1.2+R()*2,rt:null});
  if(G.k==='tech') Object.assign(G,{cur:60,cdir:1,csp:280+r*70,zw:95-r*13,zx:rint(90,470-95+r*13)});
  mgScale(G);
  G.phase='play';G.t=0;
}
function endRound(ok,txt){
  const G=GAME; if(navigator.vibrate)navigator.vibrate(ok?40:[60,40,60]); ok?SND.ok():SND.ko(); if(ok)G.score++; G.round++; G.flash={ok,txt}; G.phase='wait'; G.wait=1.1;
  $('#mgs').textContent=`Réussis : ${G.score} / ${G.round}`;
}
function gameInput(v){
  const G=GAME; if(!G) return;
  if(v==='done'){const {k,score}=G;GAME=null;closeModal();doTrain(k,score);return}
  if(G.phase!=='play') return;
  if(MG2.includes(G.k)){input2(G,v);return}
  if(G.k==='att'&&v==='act'&&!G.shot) G.shot={x:G.aim,p:0};
  if(G.k==='def'&&(v==='left'||v==='right')) G.lane=clamp(G.lane+(v==='left'?-1:1),0,2);
  if(G.k==='vit'&&v==='act'){
    if(G.light==='red') endRound(false,'Faux départ !');
    else {const ms=Math.round(G.t*1000),lim=Math.round(500*DIFF());endRound(ms<=lim,ms<=lim?`Super départ : ${ms} ms !`:`Trop lent : ${ms} ms`)}
  }
  if(G.k==='tech'&&v==='act'){const ok=G.cur>=G.zx&&G.cur<=G.zx+G.zw;endRound(ok,ok?'Plot passé !':'Balle perdue…')}
}
function gameLoop(t){
  const G=GAME; if(!G||!$('#mg')){GAME=null;return}
  const dt=Math.min(.05,(t-G.last)/1000);G.last=t;G.t+=dt;
  if(G.phase==='wait'){G.wait-=dt;if(G.wait<=0){G.flash=null;if(G.round>=5){G.phase='end';
    $('#mgb').innerHTML='<button class="btn go" data-mg="done">Valider la séance</button>';$('#mgs').textContent=`Réussis : ${G.score} / 5`}else newRound()}}
  if(G.phase==='play'&&MG2.includes(G.k)) loop2(G,dt);
  if(G.phase==='play'){
    if(G.k==='att'){
      if(!G.shot){G.aim+=G.aimDir*G.aimSp*dt;if(G.aim>460||G.aim<100){G.aimDir*=-1;G.aim=clamp(G.aim,100,460)}}
      else{G.shot.p+=dt/.35;if(G.shot.p>=1){const gx=280+Math.sin(G.t*G.gkSp)*120,ok=Math.abs(G.shot.x-gx)>48;endRound(ok,ok?'BUT !':'Arrêt du gardien !')}}
    }
    if(G.k==='def'){G.ay+=G.asp*dt;if(G.feint&&!G.feinted&&G.ay>135){G.feinted=true;G.al=(G.al+rint(1,2))%3}
      if(G.ay>=250){const ok=G.al===G.lane;endRound(ok,ok?'Balle récupérée !':'Il est passé…')}}
    if(G.k==='vit'&&G.light==='red'&&G.t>=G.delay){G.light='green';G.t=0}
    if(G.k==='vit'&&G.light==='green'&&G.t>1.2) endRound(false,'Trop lent !');
    if(G.k==='tech'){G.cur+=G.cdir*G.csp*dt;if(G.cur>500||G.cur<60){G.cdir*=-1;G.cur=clamp(G.cur,60,500)}}
  }
  MG2.includes(G.k)?draw2(G):drawGame(G); requestAnimationFrame(gameLoop);
}
function drawGame(G){
  const c=G.ctx, C=G.col; c.clearRect(0,0,560,320);
  c.fillStyle=C.turf;c.fillRect(0,0,560,320);c.fillStyle=C.turf2;for(let i=0;i<4;i++)c.fillRect(i*140,0,70,320);

  const dot=(x,y,r,col,txt)=>{c.beginPath();c.arc(x,y,r,0,7);c.fillStyle=col;c.fill();c.lineWidth=3;c.strokeStyle='#fff';c.stroke();if(txt){c.fillStyle='#fff';c.font='700 15px "Baloo 2",sans-serif';c.fillText(txt,x,y+5)}};
  if(G.k==='att'){

    const ax=G.shot?G.shot.x:G.aim;c.fillStyle=C.ball;c.beginPath();c.moveTo(ax,62);c.lineTo(ax-10,80);c.lineTo(ax+10,80);c.fill();
    drawFig(c,{color:C.club,num:heroP()?heroP().num:9,gk:false,seed:heroP()?heroP().id+heroP().name:'t',flip:false},262,300,44);
    const p=G.shot?G.shot.p:0, bx=280+(ax-280)*p, by=262-(262-40)*p; dot(bx,by,8,C.ball);
  }
  if(G.k==='def'){
    [140,280,420].forEach(x=>{c.setLineDash([8,10]);c.beginPath();c.moveTo(x-70,0);c.lineTo(x-70,320);c.stroke();c.setLineDash([])});
    c.beginPath();c.moveTo(490,0);c.lineTo(490,320);c.stroke();
    const lx=[140,280,420];
    if(G.phase!=='end'){drawFig(c,{color:'#56687C',num:9,gk:false,seed:'tatt',flip:true},lx[G.al],G.ay+20,40);dot(lx[G.al]-14,G.ay+16,6,C.ball)}
    drawFig(c,{color:C.club,num:heroP()?heroP().num:4,gk:false,seed:heroP()?heroP().id+heroP().name:'td',flip:false},lx[G.lane],292,44);
  }
  if(G.k==='vit'){
    c.fillStyle='#10233D';c.fillRect(230,40,100,190);
    dot(280,90,32,G.phase==='play'&&G.light==='red'?'#F0456F':'#3a1520');
    dot(280,180,32,G.phase==='play'&&G.light==='green'?'#1E9E68':'#12301f');
    c.fillStyle='#fff';c.font='700 22px "Baloo 2",sans-serif';
    if(G.phase==='play')c.fillText(G.light==='red'?'Prêts…':'PARTEZ !',280,280);
  }
  if(G.k==='tech'){
    for(let i=0;i<5;i++){const x=80+i*100,passed=i<G.round;c.fillStyle=passed?'rgba(255,255,255,.35)':'#FF8A3D';c.beginPath();c.moveTo(x,60);c.lineTo(x-12,95);c.lineTo(x+12,95);c.fill()}
    drawFig(c,{color:C.club,num:heroP()?heroP().num:8,gk:false,seed:heroP()?heroP().id+heroP().name:'tt',flip:false},30+Math.min(G.round,5)*100,140,40);
    c.fillStyle='rgba(255,255,255,.25)';c.fillRect(60,220,440,34);c.fillStyle='#1E9E68';c.fillRect(G.zx,220,G.zw,34);
    c.strokeRect(60,220,440,34);c.fillStyle=C.ball;c.fillRect(G.cur-4,210,8,54);
  }
  if(G.flash){c.fillStyle='rgba(8,24,48,.72)';c.fillRect(0,125,560,70);c.fillStyle=G.flash.ok?C.ball:'#fff';c.font='800 34px "Baloo 2",sans-serif';c.fillText(G.flash.txt,280,172)}
  if(G.phase==='end'){c.fillStyle='rgba(8,24,48,.8)';c.fillRect(0,0,560,320);c.fillStyle=C.ball;c.font='800 54px "Baloo 2",sans-serif';c.fillText(`${G.score} / 5`,280,150);
    c.fillStyle='#fff';c.font='700 24px "Baloo 2",sans-serif';c.fillText(G.score>=4?'Super séance !':G.score>=2?'Pas mal, continue !':'Séance difficile, on réessaiera !',280,200)}

function heroMoment(M,ctrl,fr){

function celebrate(big,sub){
  SND.pops();
  if(navigator.vibrate) navigator.vibrate([60,40,60,40,140]);
  document.querySelectorAll('.fx,.fxlab').forEach(e=>e.remove());
  const lab=document.createElement('div');lab.className='fxlab';lab.innerHTML=`<b${big.length>12?' class="xl"':big.length>6?' class="long"':''}>${esc(big)}</b><span>${esc(sub)}</span>`;document.body.appendChild(lab);
  setTimeout(()=>lab.remove(),2600);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.createElement('canvas');cv.className='fx';document.body.appendChild(cv);
  const dpr=Math.min(2,devicePixelRatio||1),W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  const c=cv.getContext('2d');c.scale(dpr,dpr);
  const cols=[S.teams[0].color,'#FFC928','#FFFFFF','#FF6FA0','#6FD3FF'];
  const rockets=[],parts=[];let t0=null,last=null;
  for(let i=0;i<7;i++) rockets.push({at:i*.22+Math.random()*.1,x:W*(.15+Math.random()*.7),y:H,ty:H*(.18+Math.random()*.3),vy:-H*1.1,col:cols[i%cols.length],done:false});
  function boom(r){const n=46+Math.floor(Math.random()*20);for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*.2,v=90+Math.random()*170;
    parts.push({x:r.x,y:r.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,col:Math.random()<.25?'#FFFFFF':r.col,s:2+Math.random()*2.5})}}
  function tick(t){
    if(t0===null){t0=t;last=t} const dt=Math.min(.04,(t-last)/1000),el=(t-t0)/1000;last=t;
    c.clearRect(0,0,W,H);
    rockets.forEach(r=>{if(r.done||el<r.at)return;r.y+=r.vy*dt;c.fillStyle='#FFE9A8';c.beginPath();c.arc(r.x,r.y,3,0,7);c.fill();
      c.strokeStyle='rgba(255,233,168,.5)';c.lineWidth=2;c.beginPath();c.moveTo(r.x,r.y);c.lineTo(r.x,r.y+18);c.stroke();
      if(r.y<=r.ty){r.done=true;boom(r)}});
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vy+=160*dt;p.vx*=.985;p.vy*=.985;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt*.75;
      if(p.life<=0){parts.splice(i,1);continue}c.globalAlpha=Math.max(0,p.life);c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,p.s,0,7);c.fill()}
    c.globalAlpha=1;
    if(el<3.2) requestAnimationFrame(tick); else cv.remove();
  }
  requestAnimationFrame(tick);
}

  const c=S.cup, r=c.rounds[c.stage], nxt=[];
  for(let i=0;i<r.length;i+=2){const a=r[i],b=r[i+1];nxt.push(a===0||b===0?(win?0:(a===0?b:a)):cupTie(a,b))}

/* sons selon les événements du match */
function sndFrame(f,ourAtt){
  const t=f.t||'';
  if(f.goal!=null) return;
  if(f.half){SND.whistle(2);SND.say('Mi-temps !');return}
  if(f.end){SND.whistle(3);return}
  if(f.c==='card'){SND.whistle(1);SND.card();SND.say(/jaune/.test(t)?'Carton jaune !':'Carton vert !');return}
  if(f.c==='foul'){if(/stroke/.test(t)){SND.whistle(1,true);SND.say('Penalty stroke !',true)}else{SND.whistle(1);const m=t.match(/[Cc]orner court pour ([^!.]+)/);if(m){SND.say('Corner court pour '+m[1].trim()+' !');if(S&&m[1].trim()===S.teams[0].name)setTimeout(()=>chantNow(false),900)}}return}
  if(/Long corner/.test(t)){SND.whistle(1);return}
  if(/poteau/.test(t)){SND.clang();return}
  if(/[Aa]rrêt|arrête|repouss|bloque|dégage|au-dessus|à côté|Juste à côté/.test(t)){SND.hit();setTimeout(()=>SND.ooh(),150);if(/Superbe|spectaculaire|incroyable|plongeon/i.test(t))SND.say('Quel arrêt !');return}
  if(/tire|frappe|arme son tir|Tir /.test(t)){SND.hit();return}
  if(f.who&&f.b) SND.toc(.5);
}

/* ---------- célébrations de but ---------- */
const CELEBS=[['saut','🙌 Saut'],['glisse','🛷 Glissade'],['avion','✈️ Avion'],['danse','💃 Danse'],['salto','🤸 Salto'],['coeur','❤️ Cœur'],['poing','✊ Poing levé'],['toupie','🌀 Toupie']];
const celebOf=p=>(p.look&&p.look.celeb)||CELEBS[hsh(p.id+p.name)%CELEBS.length][0];
const celebName=k=>(CELEBS.find(c=>c[0]===k)||CELEBS[0])[1];
function tokCele(el,type){if(!el)return;el.classList.add('cel-'+type);setTimeout(()=>el.classList.remove('cel-'+type),2400)}
/* dessin de la célébration dans le ralenti (canvas) */
function drawCele(c,im,fx,fy,w,h,e,type,dir,col){
  let dx=0,dy=0,r=0,sx=1,sy=1; const T=e/1000;
  if(type==='saut'){dy=-Math.abs(Math.sin(T*Math.PI*2.2))*h*.55}
  else if(type==='salto'){const f=(T%1);dy=-Math.sin(f*Math.PI)*h*.7;r=f*Math.PI*2*dir}
  else if(type==='danse'){dx=Math.sin(T*9)*w*.35;r=Math.sin(T*9)*.25;dy=-Math.abs(Math.sin(T*9))*h*.08}
  else if(type==='glisse'){const k=Math.min(1,T/1.1);dx=dir*k*w*2.2;sy=.8;r=-dir*.28;dy=h*.05}
  else if(type==='avion'){r=Math.sin(T*3.2)*.38;dx=Math.sin(T*1.6)*w*.9;dy=-Math.abs(Math.cos(T*3.2))*h*.05}
  else if(type==='coeur'){r=Math.sin(T*4)*.1}
  else if(type==='poing'){dy=-Math.abs(Math.sin(T*Math.PI*1.6))*h*.25}
  else if(type==='toupie'){sx=Math.cos(T*14)}
  c.save();c.translate(fx+dx,fy+dy);c.rotate(r);c.scale(sx,sy);
  if(type==='avion'){c.fillStyle=col;c.fillRect(-w*1.05,-h*.62,w*2.1,h*.07)}
  if(type==='poing'){c.strokeStyle=col;c.lineWidth=w*.14;c.lineCap='round';c.beginPath();c.moveTo(w*.15,-h*.58);c.lineTo(w*.32,-h*1.02);c.stroke();c.fillStyle='#F3CDAE';c.beginPath();c.arc(w*.33,-h*1.05,w*.11,0,7);c.fill()}
  if(im.complete&&im.naturalWidth)c.drawImage(im,-w/2,-h,w,h);c.restore();
  c.textAlign='center';
  if(type==='danse'){c.font=`${Math.round(h*.3)}px sans-serif`;c.fillText('♪',fx+dx+w*.8,fy-h*1.1+Math.sin(T*6)*8);c.fillText('♫',fx+dx-w*.8,fy-h*1.2+Math.cos(T*6)*8)}
  if(type==='coeur'){c.font=`${Math.round(h*.35)}px sans-serif`;for(let i=0;i<3;i++){const p=((T*.8+i/3)%1);c.globalAlpha=1-p;c.fillText('❤️',fx+Math.sin(i*2+T*3)*w*.5,fy-h*1.1-p*h*.9)}c.globalAlpha=1}
  if(type==='glisse'&&T<1.2){c.fillStyle='rgba(220,230,240,.6)';for(let i=0;i<5;i++){c.beginPath();c.arc(fx+dx-dir*w*(.6+i*.35),fy-3-Math.random()*6,3+Math.random()*4,0,7);c.fill()}}
  if(type==='saut'||type==='salto'){const cols=['#FFC928','#F0456F','#6FD3FF','#1E9E68'];for(let i=0;i<14;i++){const a=i*2.3+T*2,rr=w*(1+((T*1.5+i*.13)%1)*1.8);c.fillStyle=cols[i%4];c.fillRect(fx+Math.cos(a)*rr,fy-h*.7+Math.sin(a)*rr*.6+T*20,4,7)}}
}

/* ---------- les objectifs du président ---------- */
const PRES_NAMES=['M. Dubois','Mme Lambert','M. Peeters','Mme Janssens','M. Delvaux'];
function presNew(){
  const d=S.div, r=d===0?pick([['podium','Finir sur le podium de LFH1'],['safe','Éviter la descente']]):pick([['up','Monter de division (top 2)'],['half','Finir dans la première moitié du classement']]);
  const s2=pick([['cup','Atteindre les demi-finales de la coupe'],['goals','Marquer au moins 25 buts en championnat'],['defense','Encaisser moins de 20 buts en championnat']]);
  const s3=pick([['allplay','Faire jouer tous les joueurs de l’effectif'],['fair','Recevoir moins de 4 cartons'],['grow','Faire progresser 3 joueurs d’au moins +6']]);
  S.pres={season:S.season,name:(S.pres&&S.pres.name)||pick(PRES_NAMES),conf:S.pres?S.pres.conf:60,goals:[r,s2,s3].map(([id,txt])=>({id,txt})),cards:0};
}
function presEval(g){
  const tb=table(),row=tb.find(x=>x.id===0),rank=tb.findIndex(x=>x.id===0)+1,c=S.cup;
  switch(g.id){
    case 'podium':return {ok:rank<=3,p:rank<=3?1:.35,t:`${rank===1?'1er':rank+'e'} actuellement`};
    case 'safe':return {ok:rank<=6,p:rank<=6?1:.3,t:`${rank===1?'1er':rank+'e'} actuellement`};
    case 'up':return {ok:rank<=2,p:rank<=2?1:clamp((8-rank)/6,0,1),t:`${rank===1?'1er':rank+'e'} actuellement`};
    case 'half':return {ok:rank<=4,p:rank<=4?1:.4,t:`${rank===1?'1er':rank+'e'} actuellement`};
    case 'cup':{const semi=!!c&&(c.won||c.played[0]&&(c.alive||c.outAt>=1));return {ok:semi,p:semi?1:c&&c.alive?.5:0,t:!c?'—':c.won?'Coupe gagnée !':c.alive?(c.played[0]?'En demi-finale':'Quart à jouer'):`Éliminé en ${CUPN[c.outAt].toLowerCase()}`}}
    case 'goals':return {ok:row.bp>=25,p:Math.min(1,row.bp/25),t:`${row.bp} / 25 buts`};
    case 'defense':return {ok:row.bc<20,p:row.bc<20?1-row.bc/20:0,t:`${row.bc} encaissés (max 19)`};
    case 'allplay':{const n=S.players.filter(p=>p.mins>0).length;return {ok:n===S.players.length,p:n/S.players.length,t:`${n} / ${S.players.length} joueurs`}}
    case 'fair':return {ok:S.pres.cards<4,p:S.pres.cards<4?1:0,t:`${S.pres.cards} carton(s)`};
    case 'grow':{const n=S.players.filter(p=>statSum(p)-statSum(p,p.base)>=6).length;return {ok:n>=3,p:Math.min(1,n/3),t:`${n} / 3 joueurs`}}
  }
  return {ok:false,p:0,t:''};
}
function presMood(){const v=S.pres.conf;return v>=70?['😃','ravi']:v>=45?['🙂','content']:v>=25?['😐','inquiet']:['😟','très inquiet']}
function presHTML(){

const moralOf=p=>p.moral==null?70:p.moral;
const moralEm=m=>m>=75?'😄':m>=55?'🙂':m>=35?'😐':'😞';
const moralTxt=m=>m>=75?'Excellent':m>=55?'Bon':m>=35?'Moyen':'En berne';
function moralAfterMatch(M,cnt,motm){
  const win=M.us>M.them||(M.cup&&M.us===M.them&&M.so===0), lose=M.us<M.them||(M.cup&&M.us===M.them&&M.so===1), low=[];
  S.players.forEach(p=>{const m=M.played[p.id]||0, before=moralOf(p); let d=0;
    if(!S.squad.includes(p.id)) d-=3;
    else if(m<10) d-=5;
    else d+=m>=25?3:1;
    d+=Math.min(8,(cnt[p.id]||0)*4); if(motm&&motm.id===p.id) d+=6;
    if(m>0) d+=win?2:lose?-2:0;
    p.moral=clamp(65+(before-65)*.85+d,10,100); if(p.moral<35&&before>=35) low.push(first(p));
  });
  if(low.length) toast(`😞 ${low.join(', ')} ${low.length>1?'ont':'a'} le moral en berne : fais-${low.length>1?'les':'le'} jouer !`);
}

  else if(M.mom<=-100){M.tf={side:'o',until:M.min+2};M.mom=-30;say(M.shownMin||M.min,`⚠️ ${M.opp.name} met la pression ! Tenez bon en défense !`,'foul');SND.ooh()}}

function aiCoach(M){if(M.fast||!M.opp)return;const d=M.us-M.them,H=heroOn()?heroP():null;
  if(H&&!M.markDone&&M.h.g>=2){M.markDone=true;M.mark=true;say(M.min,`🧠 Le coach de ${M.opp.name} réagit : MARQUAGE INDIVIDUEL sur ${first(H)} ! (une-deux ou appel de balle pour s’en libérer)`,'foul')}

function adaptAfter(M,ok){if(!M)return;M.adS=ok?(M.adS||0)+1:0;M.adapt=ok?clamp(1-.06*Math.min(M.adS,4),.76,1):clamp((M.adapt||1)+.08,.76,1.06)}
